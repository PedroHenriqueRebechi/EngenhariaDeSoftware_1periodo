<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <title>Formulário</title>
</head>

<body>
    <form action="https://formsubmit.co/phenriquerebechi@gmail.com" method="post">
    
        <label for="name">Nome completo</label><br>
        <input type="text" id="name" name="name" required><br>

        <label for="email">Email</label><br>
        <input type="text" id="email" name="email" required><br>

        <label id="options">Escolha seu esporte favorito dentre as opções</label><br>

        <input type="radio" id="futebol" value="futebol" name="favoriteSport">
        <label for="futebol">Futebol</label><br>

        <input type="radio" id="basquete" value="basquete" name="favoriteSport">
        <label for="basquete">Basquete</label><br>

        <input type="radio" id="volei" value="vôlei" name="favoriteSport">
        <label for="volei">Vôlei</label><br>

        <label for="message">Justifique sua opção</label><br>
        <input type="text" id="message" name="message" required><br>

        <input type="submit" value="Enviar"><br>

</form>

</body>

</html>
